<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人間推理師 v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --amber: #F59E0B;
      --amber-dark: #D97706;
      --amber-light: #FEF3C7;
      --navy: #1E293B;
      --navy-light: #334155;
      --bg: #0F172A;
      --card: #1E293B;
      --text: #F1F5F9;
      --text-dim: #94A3B8;
      --green: #10B981;
      --red: #EF4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    .header {
      background: var(--navy);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--navy-light);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title { font-size: 18px; font-weight: 700; color: var(--amber); letter-spacing: 2px; }
    .header-streak { background: var(--amber); color: var(--navy); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .banner {
      background: linear-gradient(135deg, var(--navy), #1a365d);
      padding: 24px 20px 16px;
      text-align: center;
    }

    .banner-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .banner-sub { font-size: 13px; color: var(--text-dim); }
    .streak-days {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--amber);
      color: var(--navy);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 12px;
    }

    .question-card {
      margin: 16px 16px 0;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--navy-light);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--navy-light);
    }

    .question-tag { background: var(--amber); color: var(--navy); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
    .question-num { font-size: 12px; color: var(--text-dim); }

    .question-content { padding: 16px; }
    .question-type { font-size: 11px; color: var(--amber); font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
    .question-title { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--text); margin-bottom: 12px; }

    .scenario-box {
      background: #0a0f1d;
      border-left: 3px solid var(--amber);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.8;
      color: #cbd5e1;
      white-space: pre-wrap;
      font-family: -apple-system, monospace;
    }

    .options { padding: 16px; padding-top: 0; }

    .option-btn {
      width: 100%;
      background: var(--navy);
      border: 1px solid var(--navy-light);
      color: var(--text);
      font-size: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:active { transform: scale(0.98); }
    .option-btn.selected { border-color: var(--amber); background: rgba(245,158,11,0.1); }
    .option-btn.correct { border-color: var(--green); background: rgba(16,185,129,0.1); }
    .option-btn.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); }
    .option-btn.disabled { pointer-events: none; }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option-btn.correct .option-letter { background: var(--green); color: white; }
    .option-btn.wrong .option-letter { background: var(--red); color: white; }
    .option-btn.selected .option-letter { background: var(--amber); color: var(--navy); }

    .result-section { padding: 0 16px 16px; }
    .result-section.hidden { display: none; }

    .user-choice-card {
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .user-choice-card.correct { background: rgba(16,185,129,0.1); border: 1px solid var(--green); }
    .user-choice-card.wrong { background: rgba(239,68,68,0.1); border: 1px solid var(--red); }

    .user-choice-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid;
    }

    .user-choice-card.correct .user-choice-header { border-color: rgba(16,185,129,0.2); }
    .user-choice-card.wrong .user-choice-header { border-color: rgba(239,68,68,0.2); }

    .result-icon { font-size: 22px; }
    .result-label { font-size: 15px; font-weight: 700; flex: 1; }
    .user-choice-card.correct .result-label { color: var(--green); }
    .user-choice-card.wrong .result-label { color: var(--red); }

    .user-choice-text {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
      border-bottom: 1px solid;
    }

    .user-choice-card.correct .user-choice-text { border-color: rgba(16,185,129,0.2); }
    .user-choice-card.wrong .user-choice-text { border-color: rgba(239,68,68,0.2); }

    .user-feedback {
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--text-dim);
    }

    .correct-answer-card {
      background: rgba(16,185,129,0.06);
      border: 1px solid rgba(16,185,129,0.4);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .correct-answer-card .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .correct-tag { background: var(--green); color: white; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .correct-text { font-size: 14px; color: var(--green); font-weight: 700; }

    .insight-card {
      background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.05));
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .insight-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .insight-icon { font-size: 18px; }
    .insight-title { font-size: 13px; color: var(--amber); font-weight: 700; }
    .insight-text { font-size: 13px; line-height: 1.7; color: var(--text-dim); }

    .share-section { padding: 0 16px 16px; }
    .share-section.hidden { display: none; }

    .share-btn {
      width: 100%;
      background: var(--amber);
      color: var(--navy);
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .next-btn {
      width: calc(100% - 32px);
      margin: 0 16px 16px;
      background: var(--navy);
      color: var(--amber);
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border: 1px solid var(--amber);
      border-radius: 12px;
      cursor: pointer;
      display: none;
      text-align: center;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--navy);
      border-top: 1px solid var(--navy-light);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 20px;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-dim);
      font-size: 10px;
      cursor: pointer;
      padding: 4px 16px;
      border: none;
      background: none;
    }

    .tab-item.active { color: var(--amber); }
    .tab-icon { font-size: 22px; }

    .page { display: none; }
    .page.active { display: block; }

    .profile-card {
      margin: 16px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--navy-light);
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--amber), var(--amber-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
    }

    .profile-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .profile-title { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
    .profile-stats { display: flex; justify-content: space-around; border-top: 1px solid var(--navy-light); padding-top: 16px; }

    .stat-item { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--amber); }
    .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .profile-tag {
      display: inline-block;
      background: rgba(245,158,11,0.15);
      color: var(--amber);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      margin-top: 14px;
    }

    .archive-list { padding: 0 16px; }

    .archive-item {
      background: var(--card);
      border: 1px solid var(--navy-light);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .archive-q { font-size: 13px; color: var(--text-dim); flex: 1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .archive-result {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .archive-result.correct { background: rgba(16,185,129,0.2); color: var(--green); }
    .archive-result.wrong { background: rgba(239,68,68,0.2); color: var(--red); }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .question-card { animation: slideUp 0.3s ease; }

    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .result-section:not(.hidden) { animation: popIn 0.3s ease; }

    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

    .style-breakdown {
      margin: 0 16px 16px;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--navy-light);
    }

    .style-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--navy-light);
    }

    .style-row:last-child { border-bottom: none; }
    .style-name { font-size: 13px; color: var(--text); }
    .style-bar { flex: 1; margin: 0 12px; height: 6px; background: var(--navy-light); border-radius: 3px; overflow: hidden; }
    .style-bar-fill { height: 100%; background: var(--amber); transition: width 0.5s; }
    .style-pct { font-size: 12px; color: var(--amber); font-weight: 700; min-width: 36px; text-align: right; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">👁️ 人間推理師</div>
  <div class="header-streak" id="streakBadge">🔥 第1天</div>
</div>

<div class="page active" id="page-home">
  <div class="banner">
    <div class="banner-title">今日推理題</div>
    <div class="banner-sub" id="dateDisplay">加載中...</div>
    <div class="streak-days" id="streakDisplay">🔥 連續打卡 1 天</div>
  </div>

  <div id="questionArea">
    <div class="loading">正在加載題目...</div>
  </div>
</div>

<div class="page" id="page-profile">
  <div class="profile-card">
    <div class="profile-avatar">🧠</div>
    <div class="profile-name" id="profileName">推理見習生</div>
    <div class="profile-title">人間觀察者</div>
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-num" id="statAnswered">0</div>
        <div class="stat-label">答題總數</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statCorrect">0</div>
        <div class="stat-label">答對數</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statStreak">0</div>
        <div class="stat-label">連續天數</div>
      </div>
    </div>
    <div class="profile-tag" id="profileTag">完成 3 題解鎖你的專屬標籤</div>
  </div>

  <div class="style-breakdown" id="styleBreakdown" style="display:none;">
    <div style="font-size: 13px; color: var(--amber); font-weight: 700; margin-bottom: 12px;">📊 你的推理風格分析</div>
    <div id="styleRows"></div>
  </div>

  <div class="style-breakdown">
    <div style="font-size: 13px; color: var(--amber); font-weight: 700; margin-bottom: 8px;">🎯 選擇傾向</div>
    <div style="font-size: 13px; line-height: 1.7; color: var(--text-dim);" id="preferenceText">完成更多題目後解鎖...</div>
  </div>
</div>

<div class="page" id="page-history">
  <div style="padding: 16px 16px 8px; font-size: 13px; color: var(--text-dim);">答題記錄</div>
  <div class="archive-list" id="historyList">
    <div style="text-align:center; padding: 40px; color: var(--text-dim); font-size: 13px;">還沒有答題記錄</div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-item active" onclick="switchTab('home')">
    <div class="tab-icon">🏠</div>
    <div>首頁</div>
  </button>
  <button class="tab-item" onclick="switchTab('profile')">
    <div class="tab-icon">👤</div>
    <div>檔案</div>
  </button>
  <button class="tab-item" onclick="switchTab('history')">
    <div class="tab-icon">📜</div>
    <div>記錄</div>
  </button>
</div>

<script>
// ============ 題庫 v2 ============
const questions = [
  {
    id: 1,
    category: "微信潛台詞",
    level: "Lv.1",
    type: "對話",
    title: "老闆凌晨2點給你發『睡了嗎』，到底想說什麼？",
    scenario: `【微信對話】

老闆  02:17
睡了嗎？

你    [未讀]`,
    options: [
      {
        letter: "A",
        text: "他要派緊急任務給我",
        feedback: "你的第一反應是工作。但你忽略了一個關鍵：真正的緊急任務老闆會直接打電話，不會用微信。'睡了嗎'這種問候式的開頭，背後藏著的不是任務，是孤獨。"
      },
      {
        letter: "B",
        text: "他只是隨口問問，沒什麼意思",
        feedback: "你把領導當工具人——覺得他的話都應該有目的。但凌晨2點還在手機上打字的人，內心一定有困擾。'隨口'問候背後的訊號，你完全沒接住。"
      },
      {
        letter: "C",
        text: "他心裡有事想找人說話",
        isCorrect: true,
        feedback: "你看穿了職場關係的本質。但這裡有個隱藏風險——回錯了可能變成他的情緒垃圾桶，不回又顯得冷漠。最佳回覆是：'還沒，您也早點休息，有事您說。'"
      },
      {
        letter: "D",
        text: "他喝醉了，發錯人了",
        feedback: "你也太自戀了，誰會發醉話給下屬？就算喝醉了，現在的人都會馬上撤回，不會留下來。這說明你習慣了'事情都和自己無關'的防禦姿態。"
      }
    ],
    insight: "👤 選 A 的人責任心強但容易過勞；選 B 的人理性但有距離感；選 D 的人自我保護過度。"
  },
  {
    id: 2,
    category: "朋友圈拼圖",
    level: "Lv.2",
    type: "朋友圈",
    title: "三天內的三條朋友圈，能拼湊出什麼故事？",
    scenario: `三天內的三條朋友圈：

━━━━ Day 1（週五 19:30）━━━━
[圖] 一杯精緻的下午茶，背景是落地窗
配文：「週五的快樂 ☕️」

━━━━ Day 2（週六 14:00）━━━━
[圖] 同一個落地窗的位置，桌上只有一杯白水
配文：「......」

━━━━ Day 3（週日 09:15）━━━━
[圖] 一本書的封面《如何優雅地離開》
配文：「長大」`,
    options: [
      {
        letter: "A",
        text: "被公司裁員了",
        feedback: "你的思路是從『長大』聯想到職場。但裁員的標配朋友圈是『新的開始』，不是『如何優雅地離開』。而且前兩天還在悠閒喝下午茶，不符合突發失業的軌跡。"
      },
      {
        letter: "B",
        text: "失戀了",
        isCorrect: true,
        feedback: "你看穿了。Day1 的下午茶可能是對方請的最後一頓，Day2 同一個位置但變白水是物是人非，Day3 那本書『優雅地離開』是失戀者最愛的文案。但你也有盲點：這種朋友圈通常 3-7 天後會刪。"
      },
      {
        letter: "C",
        text: "創業失敗了",
        feedback: "你對創業的印象還停留在『意氣風發』，但失敗的標配朋友圈是『沉澱』『歸零』這類詞。創業失敗的人會假裝堅強，不會用『優雅』這種文藝的詞。"
      },
      {
        letter: "D",
        text: "家裡出事了（父母生病）",
        feedback: "你腦補太多。這種情況下的人通常會直接關閉朋友圈，不會連續三天發。而且『優雅地離開』跟家庭變故的沉重感完全不匹配——你的解讀太戲劇化了。"
      }
    ],
    insight: "🎭 選對的人通常感情經歷豐富，能識別『朋友圈的沉默比文字更響』這個規律。"
  },
  {
    id: 3,
    category: "餐桌心理學",
    level: "Lv.2",
    type: "場景",
    title: "兩個人去餐廳吃飯，從點的東西能看出什麼？",
    scenario: `兩人晚餐——

👨 男方點的：
• 黑咖啡
• 凱撒沙拉
• 清蒸鱸魚

👩 女方點的：
• 一杯珍珠奶茶
• 提拉米蘇
• 芝士焗飯`,
    options: [
      {
        letter: "A",
        text: "剛在一起，男方在裝健康",
        feedback: "你對約會有刻板印象——覺得男人要表現得自律。但『裝』這個字說明你把男方當綠茶了。其實很多人日常就是這樣吃飯，跟裝不裝無關。"
      },
      {
        letter: "B",
        text: "已結婚多年，生活習慣差異",
        isCorrect: true,
        feedback: "你看穿了餐桌政治。如果是約會，男女都會遷就對方，不會點反差這麼大的組合。只有在長期關係裡，雙方都懶得再偽裝，才會按自己真實喜好點。咖啡+沙拉+鱸魚 = 養生中年人；奶茶+甜品+芝士飯 = 還沒被歲月毒打過。"
      },
      {
        letter: "C",
        text: "這是商業飯局",
        feedback: "商業飯局不會去能單點這麼多菜的地方，更可能是大桌中餐。而且商業場合不會一個喝咖啡、一個喝奶茶這麼隨意——太休閒了，不像在談事。"
      },
      {

// ============ 狀態管理 ============
let currentQ = 0;
let userData = {
  streak: 0,
  lastDate: null,
  answers: [],
  totalAnswered: 0,
  totalCorrect: 0,
  optionStats: {} // {qid: {A: 0, B: 0, ...}}
};

function loadData() {
  try {
    const saved = localStorage.getItem('reasoningGame_v2');
    if (saved) userData = JSON.parse(saved);
  } catch(e) {}
}

function saveData() {
  try {
    localStorage.setItem('reasoningGame_v2', JSON.stringify(userData));
  } catch(e) {}
}

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function checkStreak() {
  const today = getToday();
  if (userData.lastDate === today) return;
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
  if (userData.lastDate === yStr) {
    userData.streak += 1;
  } else if (userData.lastDate !== today) {
    userData.streak = 1;
  }
  userData.lastDate = today;
  saveData();
}

function getProfileTag() {
  const { totalCorrect, totalAnswered } = userData;
  if (totalAnswered < 3) return "完成 3 題解鎖你的專屬標籤";
  const rate = totalCorrect / totalAnswered;
  if (rate >= 0.9) return "🔮 人間透視者";
  if (rate >= 0.7) return "🧠 洞察大師";
  if (rate >= 0.5) return "👁️ 細節獵人";
  if (rate >= 0.3) return "🌊 模糊感知者";
  return "🎲 直覺型選手";
}

function getStyleBreakdown() {
  const stats = userData.optionStats;
  const keys = Object.keys(stats);
  if (keys.length === 0) return null;
  const total = keys.reduce((s, k) => s + Object.values(stats[k]).reduce((a, b) => a + b, 0), 0);
  if (total === 0) return null;
  // 統計每個選項的選擇次數
  const letterCount = { A: 0, B: 0, C: 0, D: 0 };
  keys.forEach(qid => {
    Object.keys(stats[qid]).forEach(letter => {
      letterCount[letter] = (letterCount[letter] || 0) + stats[qid][letter];
    });
  });
  const sum = Object.values(letterCount).reduce((a, b) => a + b, 0);
  return Object.keys(letterCount).map(l => ({
    letter: l,
    count: letterCount[l],
    pct: Math.round(letterCount[l] / sum * 100)
  })).sort((a, b) => b.pct - a.pct);
}

function getPreferenceText() {
  const breakdown = getStyleBreakdown();
  if (!breakdown) return "完成更多題目後解鎖...";
  const top = breakdown[0];
  const preferenceMap = {
    A: "你傾向於『務實型』思維——第一反應找最直接的解釋",
    B: "你傾向於『關係型』思維——喜歡從人和人之間找答案",
    C: "你傾向於『深層型』思維——會繞到表面背後的動機",
    D: "你傾向於『非主流型』思維——不願意被選項限制"
  };
  return preferenceMap[top.letter] + `。你最常選 ${top.letter} 選項（${top.pct}%），這是 ${top.count} 次選擇的累積。`;
}

// ============ 渲染 ============
function renderQuestion() {
  const q = questions[currentQ];
  const html = `
    <div class="question-card">
      <div class="question-meta">
        <span class="question-tag">${q.category}</span>
        <span class="question-num">${currentQ + 1} / ${questions.length}</span>
      </div>
      <div class="question-content">
        <div class="question-type">${q.level} · ${q.type}</div>
        <div class="question-title">${q.title}</div>
        <div class="scenario-box">${q.scenario}</div>
      </div>
    </div>

    <div class="options" id="optionsArea">
      ${q.options.map(opt => `
        <button class="option-btn" data-letter="${opt.letter}" onclick="selectOption('${opt.letter}')">
          <div class="option-letter">${opt.letter}</div>
          <div>${opt.text}</div>
        </button>
      `).join('')}
    </div>

    <div class="result-section hidden" id="resultSection"></div>

    <div class="share-section hidden" id="shareSection">
      <button class="share-btn" onclick="shareQuestion()">
        🔗 分享給朋友挑戰
      </button>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
      ${currentQ < questions.length - 1 ? '下一題 →' : '🎉 玩完了，再玩一遍！'}
    </button>
  `;
  document.getElementById('questionArea').innerHTML = html;
}

function selectOption(letter) {
  const q = questions[currentQ];
  const option = q.options.find(o => o.letter === letter);
  const isCorrect = option.isCorrect;

  // 記錄答案
  userData.totalAnswered += 1;
  if (isCorrect) userData.totalCorrect += 1;
  userData.answers.push({ qid: q.id, choice: letter, correct: isCorrect, date: getToday() });
  if (!userData.optionStats[q.id]) userData.optionStats[q.id] = { A: 0, B: 0, C: 0, D: 0 };
  userData.optionStats[q.id][letter] += 1;
  saveData();
  updateStats();

  // 禁用所有按鈕 + 標記對錯
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.classList.add('disabled');
    if (btn.dataset.letter === q.options.find(o => o.isCorrect).letter) btn.classList.add('correct');
    if (btn.dataset.letter === letter && !isCorrect) btn.classList.add('wrong');
  });

  // 構建反饋區
  const resultHTML = `
    <div class="user-choice-card ${isCorrect ? 'correct' : 'wrong'}" style="margin-top: 16px;">
      <div class="user-choice-header">
        <div class="result-icon">${isCorrect ? '✅' : '❌'}</div>
        <div class="result-label">你選了 ${letter}：${option.text}</div>
      </div>
      <div class="user-choice-text">${isCorrect ? '「你的直覺是對的」' : '「你的思路是這樣的」'}</div>
      <div class="user-feedback">${option.feedback}</div>
    </div>

    ${!isCorrect ? `
      <div class="correct-answer-card">
        <div class="header-row">
          <span class="correct-tag">正解</span>
          <span class="correct-text">${q.options.find(o => o.isCorrect).letter}: ${q.options.find(o => o.isCorrect).text}</span>
        </div>
      </div>
    ` : ''}

    <div class="insight-card">
      <div class="insight-header">
        <div class="insight-icon">💡</div>
        <div class="insight-title">推理風格洞察</div>
      </div>
      <div class="insight-text">${q.insight}</div>
    </div>
  `;
  const resultSection = document.getElementById('resultSection');
  resultSection.innerHTML = resultHTML;
  resultSection.classList.remove('hidden');

  document.getElementById('shareSection').classList.remove('hidden');
  document.getElementById('nextBtn').style.display = 'block';

  // 滾動到結果區
  setTimeout(() => {
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function nextQuestion() {
  currentQ = (currentQ + 1) % questions.length;
  checkStreak();
  updateStats();
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareQuestion() {
  const q = questions[currentQ];
  const text = `👁️ 人間推理師｜${q.category} ${q.level}\n\n"${q.title}"\n\n來挑戰試試？`;
  if (navigator.share) {
    navigator.share({ title: '👁️ 人間推理師', text });
  } else {
    navigator.clipboard.writeText(text).then(() => {
      alert('題目已複製，發給朋友挑戰吧！');
    }).catch(() => {
      prompt('複製這段文字發給朋友：', text);
    });
  }
}

function updateStats() {
  const streak = userData.streak || 1;
  document.getElementById('streakBadge').textContent = `🔥 第${streak}天`;
  document.getElementById('streakDisplay').textContent = `🔥 連續打卡 ${streak} 天`;
  document.getElementById('statAnswered').textContent = userData.totalAnswered;
  document.getElementById('statCorrect').textContent = userData.totalCorrect;
  document.getElementById('statStreak').textContent = userData.streak;
  document.getElementById('profileTag').textContent = getProfileTag();
  document.getElementById('preferenceText').textContent = getPreferenceText();

  const breakdown = getStyleBreakdown();
  if (breakdown && breakdown.length > 0) {
    document.getElementById('styleBreakdown').style.display = 'block';
    document.getElementById('styleRows').innerHTML = breakdown.map(b => `
      <div class="style-row">
        <div class="style-name">${b.letter} 選項</div>
        <div class="style-bar"><div class="style-bar-fill" style="width: ${b.pct}%;"></div></div>
        <div class="style-pct">${b.pct}%</div>
      </div>
    `).join('');
  }

  // 根據答題數升級名字
  if (userData.totalAnswered >= 30) {
    document.getElementById('profileName').textContent = '人間透視者';
  } else if (userData.totalAnswered >= 15) {
    document.getElementById('profileName').textContent = '洞察大師';
  } else if (userData.totalAnswered >= 5) {
    document.getElementById('profileName').textContent = '觀察員';
  } else {
    document.getElementById('profileName').textContent = '推理見習生';
  }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (userData.answers.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-dim); font-size:13px;">還沒有答題記錄</div>';
    return;
  }
  const recent = [...userData.answers].reverse().slice(0, 30);
  list.innerHTML = recent.map(a => {
    const q = questions.find(q => q.id === a.qid);
    if (!q) return '';
    return `
      <div class="archive-item">
        <div class="archive-q">${q.title}</div>
        <div class="archive-result ${a.correct ? 'correct' : 'wrong'}">${a.choice} ${a.correct ? '✓' : '✗'}</div>
      </div>
    `;
  }).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'profile') updateStats();
  if (tab === 'history') renderHistory();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ 初始化 ============
function init() {
  loadData();
  checkStreak();
  const today = new Date();
  document.getElementById('dateDisplay').textContent =
    `${today.getMonth()+1}月${today.getDate()}日 ${['週日','週一','週二','週三','週四','週五','週六'][today.getDay()]}`;
  updateStats();
  renderQuestion();
}

init();
</script>
</body>
</html>
